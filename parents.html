<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révisions · Parents</title>
<meta name="theme-color" content="#1f2433">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<style>
:root{--fond:#f4f5f8;--carte:#fff;--txt:#1f2433;--doux:#6b7186;--bord:#e2e5ee;--acc:#5b4bdb;--vert:#1f9d55;--rouge:#d64545;--jaune:#f5b700}
@media (prefers-color-scheme:dark){:root{--fond:#14161d;--carte:#1e2130;--txt:#eef0f6;--doux:#9aa0b4;--bord:#2e3245;--acc:#8f84ff;--vert:#3ddc84;--rouge:#ff6b6b}}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;background:var(--carte);border-bottom:1px solid var(--bord);padding:10px 16px;display:flex;gap:10px;align-items:center}
header h1{font-size:1.1rem;margin:0;flex:1}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 16px;background:var(--carte);border-bottom:1px solid var(--bord)}
nav button{border:0;background:none;color:var(--doux);font:inherit;font-weight:600;padding:8px 12px;border-radius:999px;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--acc);color:#fff}
main{max-width:900px;margin:0 auto;padding:16px}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:1rem;margin:4px 0 10px}
.ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--bord)}
.ligne:last-child{border-bottom:0}
.ligne .grow{flex:1;min-width:140px}
.doux{color:var(--doux);font-size:.85rem}
button.b{border:1px solid var(--bord);background:var(--carte);color:var(--txt);font:inherit;padding:8px 12px;border-radius:10px;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.b.plus{border-color:var(--vert);color:var(--vert)}button.b.moins{border-color:var(--rouge);color:var(--rouge)}
input,select{font:inherit;color:var(--txt);background:var(--fond);border:1px solid var(--bord);border-radius:8px;padding:7px 8px}
input[type=number]{width:80px}input.ico{width:52px;text-align:center}input.nom{flex:1;min-width:140px}
.enfants{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600}
.pill.att{background:#fff4d6;color:#7a5600}.pill.ok{background:#dcf5e6;color:#14663a}
@media (prefers-color-scheme:dark){.pill.att{background:#4a3b0b;color:#ffd977}.pill.ok{background:#123d26;color:#7ee2a8}}
.grille2{display:grid;grid-template-columns:1fr 110px;gap:8px 12px;align-items:center}
#login{max-width:360px;margin:40px auto;text-align:center}
#login .points{font-size:2rem;letter-spacing:10px;min-height:2.6rem;margin:10px 0}
.pave{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin:8px 0}
.pave button{height:60px;border-radius:14px;border:1px solid var(--bord);background:var(--fond);color:var(--txt);font:inherit;font-size:1.5rem;font-weight:600;cursor:pointer}
.pave button:active{background:var(--acc);color:#fff}
.toast{pointer-events:none}
.vignette{width:52px;height:52px;border:1px dashed var(--bord);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;overflow:hidden;flex:none}
.vignette img{width:100%;height:100%;object-fit:cover}
.vignette.grande{width:96px;height:64px}.vignette video{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--fond);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;z-index:20}
.toast.v{opacity:1}
#sous-barre{max-width:900px;margin:12px auto 0;padding:0 16px;display:flex;gap:10px;align-items:center}
.menu .entree{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;border-bottom:1px solid var(--bord);background:none;color:var(--txt);font:inherit;font-size:1.05rem;padding:14px 4px;cursor:pointer;text-align:left}
.menu .entree:last-child{border-bottom:0}.menu .entree small{display:block;color:var(--doux);font-size:.82rem;font-weight:400}.menu .entree span.fl{color:var(--doux);font-size:1.4rem}
.temps{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.jauge-t{flex:1;min-width:120px;height:10px;border-radius:99px;background:var(--bord);overflow:hidden}.jauge-t i{display:block;height:100%;background:var(--acc)}
.code-choix{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;max-width:420px}.code-choix button{font-size:1.5rem;border:1px solid var(--bord);background:var(--fond);border-radius:10px;padding:4px;cursor:pointer}
.code-choix button.sel{background:var(--acc);border-color:var(--acc)}
.bandeau-maj{margin:12px auto;max-width:900px;background:#e8f7ee;border:2px solid #2fc76a}.bandeau-maj pre{white-space:pre-wrap;font-family:inherit;margin:4px 0}.bandeau-maj code{background:#fff;padding:4px 8px;border-radius:6px}
</style>
</head>
